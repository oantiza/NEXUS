# Comprueba el programa en un Windows real y construye la versión que no necesita Python.
name: Windows

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXUS_NO_ABRIR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas automáticas
        run: python -m pytest -q

      - name: Crear un ensayo simulado
        run: python scripts/ensayo_sintetico.py prueba_ci/marcha_sintetica.c3d

      - name: Lanzador por arrastre (.bat)
        shell: cmd
        run: |
          call "Revisar ensayos.bat" prueba_ci\marcha_sintetica.c3d
          if not exist informes\indice.html exit /b 1
          if not exist informes\marcha_sintetica\informe.html exit /b 1

      - name: Construir el programa sin Python
        run: >
          pyinstaller --noconfirm --clean --onedir --console --name RevisarEnsayos
          --paths . --collect-all ezc3d --collect-data matplotlib
          nexus_mocap/lanzador.py

      - name: Probar el programa construido
        shell: cmd
        run: |
          dist\RevisarEnsayos\RevisarEnsayos.exe --no-abrir prueba_ci\marcha_sintetica.c3d
          if errorlevel 1 exit /b 1
          if not exist dist\RevisarEnsayos\informes\marcha_sintetica\informe.html exit /b 1
          findstr /c:"Eventos propuestos" dist\RevisarEnsayos\informes\marcha_sintetica\informe.html >nul || exit /b 1
          rmdir /s /q dist\RevisarEnsayos\informes

      - name: Guardar el programa
        uses: actions/upload-artifact@v4
        with:
          name: RevisarEnsayos-windows
          path: dist/RevisarEnsayos
          retention-days: 30
